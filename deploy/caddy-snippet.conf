# 追加到 baka-akari.zone 的 site 块内（在 file_server 之前）。
# 保留旧 /tools/watermark-v3/ 静态直到测试稳定，届时手动删除对应 handle 与 /var/www/personal-home/tools/watermark-v3/ 目录。

# API 反代（必须在静态 handle 之前，Caddy handle 无优先级但更具体路径匹配先命中）
handle /tools/kari-imprint/api/* {
    reverse_proxy 127.0.0.1:21832
}

# 前端静态 SPA
handle /tools/kari-imprint/* {
    root * /var/www/personal-home
    try_files {path} /tools/kari-imprint/index.html
    file_server
}
