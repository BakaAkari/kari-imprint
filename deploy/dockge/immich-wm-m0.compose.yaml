# M1 preview in the existing M0 isolation: prepare an isolated Immich test output library and exclude .wm-tmp
# before starting. This does not alter/restart the existing Immich stack.
services:
  immich-wm-m0:
    image: kari-imprint/immich-wm:m1-preview
    platform: linux/amd64
    user: "${WM_UID:-10001}:${WM_GID:-10001}"
    ports: ["127.0.0.1:2285:2285"]
    environment:
      WM_PUBLIC_ORIGIN: ${WM_PUBLIC_ORIGIN:-}
      IMMICH_URL: http://app-immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:?required}
      WM_M0_TOKEN: ${WM_M0_TOKEN:-}
      WM_OIDC_ISSUER: ${WM_OIDC_ISSUER:-}
      WM_OIDC_CLIENT_ID: ${WM_OIDC_CLIENT_ID:-}
      WM_OIDC_CLIENT_SECRET: ${WM_OIDC_CLIENT_SECRET:-}
      WM_OIDC_ALLOWED_GROUP: ${WM_OIDC_ALLOWED_GROUP:-}
      WM_SOURCE_LIBRARY_ID: ${WM_SOURCE_LIBRARY_ID:?required}
      WM_OUTPUT_LIBRARY_ID: ${WM_OUTPUT_LIBRARY_ID:?required}
      WM_OUTPUT_PREFIX: /external/camera-watermarked-m0
    volumes:
      - /mnt/user/camera-workspace/exports:/imports:ro
      - /mnt/user/camera-workspace/watermarked-m0:/output:rw
      - /mnt/user/appdata/app-immich-wm-m0:/data:rw
    mem_limit: 4g
    cpus: 2
    pids_limit: 64
    init: true
    restart: "no"
    networks: [media-edit]
networks:
  media-edit:
    external: true
    name: app-media-edit
