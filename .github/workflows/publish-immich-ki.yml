name: Publish immich-ki image

on:
  push:
    branches: [main]
    paths:
      - 'apps/immich-ki/**'
      - 'apps/api/**'
      - 'packages/kari-core/**'
      - 'apps/web/**'
      - 'assets/**'
      - 'pyproject.toml'
      - '.github/workflows/publish-immich-ki.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-immich-ki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # assets/fonts is gitignored; pin official Noto CJK files by SHA-256
      # (same pinned files the deployment images verify at build time).
      - name: Fetch pinned render fonts
        run: bash scripts/fetch_fonts.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/immich-ki/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bakaakari/immich-ki:sha-${{ github.sha }}
            ghcr.io/bakaakari/immich-ki:latest
          labels: |
            org.opencontainers.image.source=https://github.com/BakaAkari/kari-imprint
            org.opencontainers.image.revision=${{ github.sha }}
          # public.ecr.aws enforces data limits on GitHub runner IPs (429);
          # pull base images from Docker Hub in CI instead.
          build-args: |
            NODE_IMAGE=node:24-bookworm-slim
            PYTHON_IMAGE=python:3.13-slim-bookworm
